<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deskmate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font: 14px/1.6 -apple-system, "SF Mono", Menlo, monospace;
    background: transparent;
    color: #e2e0dc;
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  .card {
    width: 560px; max-width: 90vw;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-radius: 18px;
    padding: 28px 32px;
    box-shadow: 0 0 40px 6px rgba(34, 211, 238, 0.18), 0 24px 48px rgba(0,0,0,0.45);
  }
  h1 {
    font-size: 11px; font-weight: 600; color: #22d3ee;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;
  }
  #reply {
    white-space: pre-wrap; word-break: break-word;
    max-height: 360px; overflow-y: auto; margin-bottom: 14px;
    user-select: text; -webkit-user-select: text;
    color: #f1f0ee; font-size: 15px; line-height: 1.65;
  }
  #extra {
    color: #94a3b8; font-size: 13px; margin-bottom: 12px;
    word-break: break-word; white-space: pre-wrap;
    user-select: text; -webkit-user-select: text;
  }
  #copy-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #copied { color: #22d3ee; font-size: 12px; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1; font: 14px inherit; background: rgba(30, 41, 59, 0.85);
    color: #f1f0ee; border: 1px solid rgba(34, 211, 238, 0.25);
    border-radius: 10px; padding: 10px 14px; outline: none;
    -webkit-app-region: no-drag;
  }
  input::placeholder { color: #64748b; }
  input:focus { border-color: #22d3ee; box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
  button {
    font: 600 13px inherit; border: 1px solid rgba(34, 211, 238, 0.3);
    background: rgba(30, 41, 59, 0.85); color: #e2e0dc;
    border-radius: 10px; padding: 10px 18px; cursor: pointer;
    -webkit-app-region: no-drag; transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(34, 211, 238, 0.15); border-color: #22d3ee; }
  button.primary {
    background: #22d3ee; border-color: #22d3ee;
    color: #0f172a; font-weight: 700;
  }
  button.primary:hover { background: #38bdf8; }
  .hidden { display: none !important; }
  /* thinking / listening spinner */
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(34,211,238,0.3);
           border-top-color: #22d3ee; border-radius: 50%; animation: spin 0.8s linear infinite;
           margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <h1 id="title">deskmate</h1>
  <div id="reply"></div>
  <div id="copy-row" class="hidden">
    <button id="copy-btn">Copy</button>
    <span id="copied" class="hidden">Copied ✓</span>
  </div>
  <div id="extra" class="hidden"></div>
  <div id="input-row" class="row hidden">
    <input id="ask" placeholder="Ask deskmate anything…" maxlength="1000" autocomplete="off" spellcheck="false" />
    <button id="ptt-btn" title="Hold to talk">🎤</button>
    <button id="mute-btn" title="Mute voice replies">🔊</button>
    <button id="ask-btn" class="primary">Ask</button>
  </div>
  <div id="action-row" class="row hidden">
    <button id="do-btn" class="primary">Do it</button>
    <button id="cancel-btn">Cancel</button>
  </div>
  <div id="settings-row" class="row hidden">
    <button id="settings-btn">Open System Settings</button>
    <button id="dismiss-btn">Dismiss</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let state = null;

  window.deskmate.onState((s) => { state = s; render(s); });

  function render(s) {
    const label = s.mode === 'thinking' ? 'Thinking…'
                : s.mode === 'listening' ? 'Listening…'
                : '';
    $('title').innerHTML = label
      ? '<span class="spin"></span> deskmate — ' + label
      : 'deskmate';
    $('reply').textContent = s.reply || '';
    $('reply').classList.toggle('hidden', s.mode === 'input');
    $('copy-row').classList.toggle('hidden', !(s.reply || s.mode === 'action' || s.mode === 'info'));
    $('input-row').classList.toggle('hidden', s.mode === 'thinking' || s.mode === 'action');
    $('action-row').classList.toggle('hidden', s.mode !== 'action');
    $('settings-row').classList.toggle('hidden', s.mode !== 'error' || !/E_PERM/.test(s.code || ''));
    if (s.mode === 'action') {
      $('extra').textContent =
        s.intent === 'TYPE' ? 'Will type: "' + (s.text || '') + '"' :
        s.intent === 'RUN' ? 'Will run:\n$ ' + (s.text || '') :
        s.intent === 'KEYS' ? 'Will press: ' + (s.keys || '') :
        'Will click the highlighted point';
    }
    $('extra').classList.toggle('hidden', s.mode !== 'action');
    if (s.mode === 'input') $('ask').focus();
    if (s.mode === 'info' || s.mode === 'error') $('ask').focus();
  }

  function submit() {
    window.deskmate.submit($('ask').value);
    $('ask').value = '';
  }
  function cancel() { window.deskmate.cancel(); }

  // click on dark background (not the card) to dismiss
  document.body.addEventListener('mousedown', (e) => {
    if (e.target === document.body) cancel();
  });

  $('ask-btn').onclick = submit;
  const muteBtn = $('mute-btn');
  let muted = localStorage.getItem('dm-muted') === '1';
  const syncMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; };
  syncMute();
  muteBtn.onclick = () => { muted = !muted; localStorage.setItem('dm-muted', muted ? '1' : '0'); syncMute(); };
  const ptt = $('ptt-btn');
  let pttDown = false;
  const press = () => { if (pttDown || muted) return; pttDown = true; ptt.textContent = '🎙️'; window.deskmate.voiceStart(); };
  const release = () => { if (!pttDown) return; pttDown = false; ptt.textContent = '🎤'; window.deskmate.voiceStop(); };
  ptt.addEventListener('pointerdown', press);
  ptt.addEventListener('pointerup', release);
  ptt.addEventListener('pointerleave', release);
  ptt.addEventListener('contextmenu', (e) => e.preventDefault());
  $('copy-btn').onclick = async () => {
    const text = (state && state.reply) || '';
    if (!text) return;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const r = $('reply'); const sel = window.getSelection(); const range = document.createRange();
      range.selectNodeContents(r); sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy'); sel.removeAllRanges();
    }
    $('copied').classList.remove('hidden'); setTimeout(() => $('copied').classList.add('hidden'), 1500);
  };
  $('ask').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') cancel();
  });
  $('do-btn').onclick = () => window.deskmate.confirm();
  $('cancel-btn').onclick = cancel;
  $('dismiss-btn').onclick = cancel;
  $('settings-btn').onclick = () =>
    window.deskmate.openSettings(state && state.code === 'E_PERM_AX' ? 'Privacy_Accessibility' : 'Privacy_ScreenCapture');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancel(); });
</script>
</body>
</html>
