<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deskmate overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  .fade { opacity: 0; transition: opacity 0.15s ease; }
  .fade.in { opacity: 1; }
  svg g { filter: drop-shadow(0 0 6px rgba(74, 56, 44, 0.85)); }
  text { font: 600 15px -apple-system, Menlo, monospace; fill: #fff8f4;
         paint-order: stroke; stroke: rgba(74, 56, 44, 0.9); stroke-width: 4px; }
</style>
</head>
<body>
<svg>
  <g id="g" class="fade">
    <circle id="ring" r="18" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <text id="label" text-anchor="middle" y="42"></text>
  </g>
</svg>
<script>
  const q = new URLSearchParams(location.search);
  const x = +q.get('x') || -1;
  const y = +q.get('y') || -1;
  const ms = +q.get('ms') || 6000;
  const px = x >= 0 ? (x / 1000) * innerWidth : -100;
  const py = y >= 0 ? (y / 1000) * innerHeight : -100;
  const ring = document.getElementById('ring');
  ring.setAttribute('cx', px);
  ring.setAttribute('cy', py);
  const label = document.getElementById('label');
  label.setAttribute('x', px);
  label.setAttribute('y', py + 42);
  label.textContent = q.get('label') || '';
  const g = document.getElementById('g');
  requestAnimationFrame(() => g.classList.add('in'));
  setTimeout(() => {
    g.classList.remove('in');
    setTimeout(() => window.close(), 200);
  }, ms);
</script>
</body>
</html>
